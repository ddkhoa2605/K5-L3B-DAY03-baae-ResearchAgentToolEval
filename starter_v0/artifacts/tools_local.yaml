# LOCAL (small model) tool declarations — v5-local.
# Copied VERBATIM from artifacts/tools.yaml (v4); only the 6 tools used by eval_base are kept.
# Not used by the cloud agent; run with --tools artifacts/tools_local.yaml
tools:
  - name: clarify
    description: "Hỏi lại người dùng một câu và chờ lượt trả lời tiếp theo. Dùng khi (1) thiếu thông tin bắt buộc để gọi tool khác: không rõ tài khoản, không có URL, không rõ chủ đề; hoặc (2) cần xác nhận trước một hành động có side effect như gửi/đăng/publish. KHÔNG dùng khi yêu cầu đã đủ thông tin, và KHÔNG dùng cho yêu cầu ngoài phạm vi (khi đó trả lời bằng text, không gọi tool)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn, nói rõ đang thiếu gì hoặc đang xin xác nhận việc gì."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "yes_no: BẮT BUỘC khi xin xác nhận trước khi gửi/đăng (send). text: khi cần user cung cấp thông tin còn thiếu (handle, URL, chủ đề). choice: khi đưa ra vài lựa chọn cụ thể trong options."}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ dùng khi response_type=choice: danh sách lựa chọn."}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của MỘT tài khoản X/Twitter cụ thể. Dùng khi user nêu rõ tài khoản hoặc tên người (ví dụ: tweet mới nhất của Elon Musk). KHÔNG dùng để tìm bài theo từ khoá/chủ đề (dùng social_search). Nếu user không nói tài khoản nào, KHÔNG đoán — gọi clarify."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle KHÔNG có @. Map tên người sang handle, ví dụ Elon Musk → elonmusk, Sam Altman → sama."}
        limit: {type: integer, default: 5, description: "Số bài user yêu cầu (ví dụ '3 tweet' → 3). Không nói thì để 5."}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên X/Twitter theo từ khoá hoặc chủ đề, từ nhiều tài khoản. Dùng khi user hỏi mọi người đang nói gì về một chủ đề, hoặc tìm tweet về X. KHÔNG dùng khi user muốn bài của một tài khoản cụ thể (dùng timeline), hay tin tức/thông tin trên web (dùng lookup)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khoá chủ đề cốt lõi, ví dụ 'AI', 'Gemini'. Không thêm chữ 'tweet' hay 'twitter'."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top khi user muốn bài nổi bật / hot / nhiều tương tác. Latest khi user muốn mới nhất / gần đây, hoặc không nói gì."}
        limit: {type: integer, default: 5, description: "Số bài user yêu cầu. Không nói thì để 5."}
      required: [query]

  - name: lookup
    description: "Tìm thông tin trên web. Dùng cho tin tức (topic=news) hoặc tra cứu chung (topic=general). KHÔNG dùng để lấy bài đăng mạng xã hội (dùng social_search/timeline) hay để đọc một URL cụ thể (dùng fetch)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ chủ đề cốt lõi, ví dụ 'AI'. KHÔNG thêm 'news', 'tin tức', 'hôm nay' vì đã có topic/timeframe."}
        topic: {type: string, enum: [general, news], default: "general", description: "news khi user hỏi tin / tin tức / mới nhất / sự kiện. general cho tra cứu kiến thức thông thường."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "hôm nay → day, tuần này → week, tháng này → month, năm nay → year. Không nói thì để week."}
        max_results: {type: integer, default: 5, description: "Số kết quả user yêu cầu. Không nói thì để 5."}
      required: [query]

  - name: fetch
    description: "Đọc nội dung của MỘT URL cụ thể mà user đã đưa. Dùng khi trong hội thoại có URL đầy đủ (http/https). KHÔNG dùng để tìm kiếm (dùng lookup). Nếu user nói 'bài này / link này' mà chưa có URL, KHÔNG bịa URL — gọi clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ lấy nguyên văn từ tin nhắn của user, bắt đầu bằng http:// hoặc https://."}
      required: [url]

  - name: send
    description: "Gửi một đoạn text lên Telegram channel của nhóm. Đây là HÀNH ĐỘNG CÓ SIDE EFFECT. Khi user yêu cầu gửi / đăng / post / publish, bước đầu tiên LUÔN là clarify với response_type=yes_no để xin xác nhận, kể cả khi nội dung chưa rõ (khi đó hỏi xác nhận và đề nghị user cung cấp nội dung trong cùng câu hỏi). Chỉ gọi send sau khi user đã trả lời đồng ý rõ ràng. KHÔNG dùng send để trả lời user."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung chính xác đã được user xác nhận."}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true khi user ĐÃ xác nhận đồng ý gửi ở lượt trước. Chưa xác nhận thì không gọi send."}
      required: [text]
